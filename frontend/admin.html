<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel administrativo — Héstia</title>
  <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
  <main class="max-w-3xl mx-auto px-4 py-6">
    <a href="./" class="btn-secundario">← Héstia</a>
    <h1 class="text-2xl font-extrabold text-slate-900 mt-4" data-i18n="admin.title">Painel administrativo</h1>
    <form id="formAdmin" class="card mt-5">
      <label for="periodoMetricas" class="block text-base font-semibold mb-1" data-i18n="admin.period">Período</label>
      <select id="periodoMetricas" class="campo mb-3">
        <option value="7" data-i18n="admin.period.7">Últimos 7 dias</option>
        <option value="30" selected data-i18n="admin.period.30">Últimos 30 dias</option>
        <option value="90" data-i18n="admin.period.90">Últimos 90 dias</option>
      </select>
      <label for="tokenAdmin" class="block text-base font-semibold mb-1" data-i18n="admin.token">Token administrativo</label>
      <input id="tokenAdmin" type="password" autocomplete="current-password" class="campo" required>
      <button type="submit" class="btn-primario w-full mt-3" data-i18n="admin.load">Carregar métricas</button>
    </form>
    <p id="erroAdmin" class="mt-4 text-gray-700" role="alert"></p>
    <section id="metricasAdmin" class="mt-5" hidden>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <article class="card"><strong data-i18n="admin.visitors">Visitantes</strong><p id="metricasVisitantes" class="text-2xl"></p></article>
        <article class="card"><strong data-i18n="admin.recurring">Recorrentes</strong><p id="metricasRecorrentes" class="text-2xl"></p></article>
        <article class="card"><strong data-i18n="admin.events">Eventos</strong><p id="metricasEventos" class="text-2xl"></p></article>
        <article class="card"><strong data-i18n="admin.analyses">Análises</strong><p id="metricasAnalises" class="text-2xl"></p></article>
      </div>
      <div id="listasMetricas" class="mt-5 space-y-3"></div>
    </section>
  </main>
  <script src="./api-config.js"></script>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
